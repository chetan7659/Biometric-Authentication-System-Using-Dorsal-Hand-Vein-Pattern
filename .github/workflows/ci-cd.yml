name: CI/CD Pipeline — Vein Auth System

# ─── Trigger ─────────────────────────────────────────────────────────────────
# Runs on every push and pull request to main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  # ── Job 1: Lint & Test ───────────────────────────────────────────────────────
  lint-and-test:
    name: 🔍 Lint & Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python 3.9 (matching the Dockerfile)
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Cache pip packages so subsequent runs are faster
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Install all dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # 5. Lint: only catch CRITICAL errors (syntax errors, undefined names)
      #    This will FAIL the build if any Python file has a syntax error.
      - name: Lint with flake8 (critical errors only)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,venv,.venv

      # 6. Validate that the app module imports correctly (smoke test)
      - name: Smoke Test — Check Python imports
        run: |
          python -c "import streamlit; import cv2; import numpy; import sklearn; print('All imports OK ✅')"

  # ── Job 2: Build Docker Image ────────────────────────────────────────────────
  docker-build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test  # Only runs if the lint job passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Cache Docker layers to speed up subsequent builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build only (no push) — validates the Dockerfile is correct
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: vein-auth:${{ github.sha }},vein-auth:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Prevents cache from growing unboundedly
      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: ✅ Build Successful
        run: echo "Docker image built successfully for commit ${{ github.sha }}"
